name: Validate recorded experiment
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m unittest discover -s tests -v
      - run: python experiments/pilot/compare_pilot.py
      - run: python experiments/pilot/align_relations.py
      - run: python experiments/pilot/check_name_diagnostic.py
      - run: git diff --exit-code -- experiments/pilot/pilot_comparison.json experiments/pilot/aligned_comparison.json experiments/pilot/정렬후_비교.md experiments/pilot/name_diagnostic.json experiments/pilot/이름기반_재실험.md
      - run: python experiments/pilot/compare_pilot.py --extra-raw experiments/pilot/e1024_raw --out experiments/pilot/e1024_comparison.json
      - run: python experiments/pilot/report_e1024.py
      - run: git diff --exit-code -- experiments/pilot/e1024_comparison.json experiments/pilot/e1024_aligned_pairs.json experiments/pilot/E1024_비교.md
      - run: python experiments/expanded/analyze_results.py
      - run: git diff --exit-code -- experiments/expanded/results/점검통계.json experiments/expanded/results/확대실험_점검보고서.md
